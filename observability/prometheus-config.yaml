global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # application metrics received via OTLP and exposed by the collector prometheus exporter
  - job_name: otel-collector-exporter
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  # collector internal telemetry metrics
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
