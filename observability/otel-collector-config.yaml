receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: detailed
  otlp:
    endpoint: "http://jaeger:4317"
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: agent_obs
    send_timestamps: true
    metric_expiration: 180m

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug,otlp]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug,prometheus]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
