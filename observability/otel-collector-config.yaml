receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: detailed
  otlp:
    endpoint: "http://jaeger:4317"
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: agent_obs
    send_timestamps: true
    metric_expiration: 180m
    # exemplars (metric -> trace) are only exposed in the OpenMetrics format
    enable_open_metrics: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  otlp_http/mlflow:
    endpoint: http://mlflow:5000
    headers:
      x-mlflow-experiment-id: ${env:MLFLOW_EXPERIMENT_ID}
    tls:
      insecure: true

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug,otlp,otlp_http/mlflow]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug,prometheus]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug,otlp_http/loki]
