services:
  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      vector-db:
        condition: service_healthy

  vector-db:
    image: chromadb/chroma
    volumes:
      - ./chroma_data:/data
    ports:
      - "${VECTOR_DB_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
