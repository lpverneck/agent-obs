services:
  #----------------------------------------------------------------------------
  # API service
  #----------------------------------------------------------------------------
  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: agent-obs-api
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      vector-db:
        condition: service_healthy
    networks:
      - agent_obs_network
  #----------------------------------------------------------------------------
  # Vector database service
  #----------------------------------------------------------------------------
  vector-db:
    image: chromadb/chroma
    container_name: agent-obs-vector-db
    volumes:
      - chroma_data:/data
    ports:
      - "${VECTOR_DB_PORT:-8001}:8000"
    environment:
      - CHROMA_OPEN_TELEMETRY__ENDPOINT=http://otel-collector:4317/
      - CHROMA_OPEN_TELEMETRY__SERVICE_NAME=vector-db-service
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/8000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - agent_obs_network
  #----------------------------------------------------------------------------
  # OTEL collector service
  #----------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.146.0
    container_name: agent-obs-otel-collector
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "${OTEL_PPROF_PORT}:1888"
      - "${OTEL_PROMETHEUS_PORT}:8888"
      - "${OTEL_PROMETHEUS_EXPORTER_PORT}:8889"
      - "${OTEL_HEALTH_PORT}:13133"
      - "${OTLP_GRPC_PORT}:4317"
      - "${OTLP_HTTP_PORT}:4318"
      - "${OTEL_ZPAGES_PORT}:55679"
    networks:
      - agent_obs_network
  #----------------------------------------------------------------------------
  # Jaeger service
  #----------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/jaeger:2.15.1
    container_name: agent-obs-jaeger
    volumes:
      - ./observability/jaeger-config.yaml:/jaeger/config.yaml
    command: ["--config", "/jaeger/config.yaml"]
    ports:
      - "${JAEGER_UI_PORT}:16686"
    networks:
      - agent_obs_network
  #----------------------------------------------------------------------------
  # Prometheus service
  #----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: agent-obs-prometheus
    volumes:
      - ./observability/prometheus-config.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - otel-collector
    networks:
      - agent_obs_network
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
networks:
  agent_obs_network:

volumes:
  chroma_data:
  prometheus_data:
